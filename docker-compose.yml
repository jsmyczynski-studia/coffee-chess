services:
  eureka-server:
    build:
      context: .
      dockerfile: backend/eureka-server/Dockerfile
    container_name: cc-eureka-server
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      EUREKA_USERNAME: ${EUREKA_USERNAME:-eureka}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:-eurekaSecret123}
      EUREKA_HOSTNAME: eureka-server
    networks:
      - coffee-chess-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8761/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  config-server:
    build:
      context: .
      dockerfile: backend/config-server/Dockerfile
    container_name: cc-config-server
    ports:
      - "8888:8888"
    environment:
      CONFIG_USERNAME: ${CONFIG_USERNAME}
      CONFIG_PASSWORD: ${CONFIG_PASSWORD}
      EUREKA_USERNAME: ${EUREKA_USERNAME}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD}
      EUREKA_HOST: eureka-server
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - coffee-chess-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 50s
    restart: unless-stopped

  postgres-user:
    image: postgres:16-alpine
    container_name: cc-postgres-user
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-user-data:/var/lib/postgresql/data
    networks:
      - coffee-chess-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d userdb"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres-game:
    image: postgres:16-alpine
    container_name: cc-postgres-game
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: gamedb
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-game-data:/var/lib/postgresql/data
    networks:
      - coffee-chess-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d gamedb"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres-analysis:
    image: postgres:16-alpine
    container_name: cc-postgres-analysis
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: analysisdb
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-analysis-data:/var/lib/postgresql/data
    networks:
      - coffee-chess-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d analysisdb"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.1.0
    container_name: cc-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - coffee-chess-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.5
    container_name: cc-keycloak
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - ./infra/keycloak/coffee-chess-realm.json:/opt/keycloak/data/import/coffee-chess-realm.json:ro
    networks:
      - coffee-chess-net
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: backend/user-service/Dockerfile
    container_name: cc-user-service
    ports:
      - "8081:8081"
    environment:
      CONFIG_USERNAME: ${CONFIG_USERNAME}
      CONFIG_PASSWORD: ${CONFIG_PASSWORD}
      CONFIG_HOST: config-server
      EUREKA_USERNAME: ${EUREKA_USERNAME}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD}
      EUREKA_HOST: eureka-server
      DB_USER_HOST: postgres-user
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_HOST: kafka
      KEYCLOAK_HOST: keycloak
    depends_on:
      config-server:
        condition: service_healthy
      postgres-user:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - coffee-chess-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  game-service:
    build:
      context: .
      dockerfile: backend/game-service/Dockerfile
    container_name: cc-game-service
    ports:
      - "8082:8082"
    environment:
      CONFIG_USERNAME: ${CONFIG_USERNAME}
      CONFIG_PASSWORD: ${CONFIG_PASSWORD}
      CONFIG_HOST: config-server
      EUREKA_USERNAME: ${EUREKA_USERNAME}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD}
      EUREKA_HOST: eureka-server
      DB_GAME_HOST: postgres-game
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_HOST: kafka
      KEYCLOAK_HOST: keycloak
    depends_on:
      config-server:
        condition: service_healthy
      postgres-game:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - coffee-chess-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  analysis-service:
    build:
      context: .
      dockerfile: backend/analysis-service/Dockerfile
    container_name: cc-analysis-service
    ports:
      - "8083:8083"
    environment:
      CONFIG_USERNAME: ${CONFIG_USERNAME}
      CONFIG_PASSWORD: ${CONFIG_PASSWORD}
      CONFIG_HOST: config-server
      EUREKA_USERNAME: ${EUREKA_USERNAME}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD}
      EUREKA_HOST: eureka-server
      DB_ANALYSIS_HOST: postgres-analysis
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_HOST: kafka
    depends_on:
      config-server:
        condition: service_healthy
      postgres-analysis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - coffee-chess-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8080}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-coffee-chess}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-coffee-chess-frontend}
    container_name: cc-frontend
    ports:
      - "5173:80"
    depends_on:
      user-service:
        condition: service_healthy
      game-service:
        condition: service_healthy
      analysis-service:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - coffee-chess-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

networks:
  coffee-chess-net:
    driver: bridge

volumes:
  postgres-user-data:
  postgres-game-data:
  postgres-analysis-data:
