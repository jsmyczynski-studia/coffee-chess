spring:
  datasource:
    url: jdbc:postgresql://${DB_ANALYSIS_HOST:localhost}:5432/analysisdb
    username: ${DB_USER:coffeechess}
    password: ${DB_PASSWORD:secret}
    hikari:
      maximum-pool-size: 5
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:9092
    consumer:
      group-id: analysis-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "pl.coffeechess.*"

server:
  port: 8083

chess:
  api:
    url: ${CHESS_API_URL:https://chess-api.com/v1}
    timeout-seconds: 15
    analysis-depth: 16