spring:
  application:
    name: analysis-service
  config:
    import: optional:configserver:http://${CONFIG_USERNAME:configuser}:${CONFIG_PASSWORD:configSecret123}@${CONFIG_HOST:localhost}:8888

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USERNAME:eureka}:${EUREKA_PASSWORD:eurekaSecret123}@${EUREKA_HOST:localhost}:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always